[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thea-simulation"
version = "0.1.0"
description = "Optional LIBERO and RoboTwin integrations for Thea"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "EIT-HAI"}]
dependencies = [
  "thea-harness>=0.1.0,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]
dev = [
  "build>=1.2,<2",
  "pytest>=7,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools]
packages = [
  "thea_simulation",
  "thea_simulation.adapters",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
