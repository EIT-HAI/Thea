[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thea-lark"
version = "0.1.0"
description = "Lark and Feishu channel for the provider-neutral Thea Harness"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "EIT-HAI"}]
dependencies = [
  "thea-harness>=0.1.0,<0.2",
  "cryptography>=42,<49",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "lark-oapi>=1.6.5,<2",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]
dev = [
  "build>=1.2,<2",
  "pytest>=7,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
thea-lark = "thea_lark.server:main"

[tool.setuptools]
packages = ["thea_lark"]
package-dir = {thea_lark = "."}
include-package-data = true

[tool.setuptools.package-data]
thea_lark = ["config.example.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
