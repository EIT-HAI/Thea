<svg xmlns="http://www.w3.org/2000/svg" width="70" height="30" viewBox="0 0 70 30" role="img" aria-labelledby="title">
  <title id="title">Bilibili</title>
  <style>
    .ink { color: #2e2f2a; }
    .label { fill: currentColor; font-family: Lato, Arial, sans-serif; font-size: 18.36px; font-weight: 400; }
    .sep { fill: #9a9b95; }
    @media (prefers-color-scheme: dark) { .ink { color: #f2f3f2; } }
  </style>
  <g class="ink">
    <text class="label sep" x="0" y="21">/</text>
    <text class="label" x="12" y="21">Bilibili</text>
  </g>
</svg>
